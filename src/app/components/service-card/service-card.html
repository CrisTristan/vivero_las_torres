<div 
    class="service-card relative flex flex-col justify-center items-center m-5 bg-green-100 border-green-800 border-2 rounded-lg overflow-hidden"
>
    <div class="service-card-content w-full flex flex-col gap-4 bg-radial from-green-200 from-40% to-emerald-300 p-5">
        <div class="flex flex-col items-center justify-center gap-5">
            <div class="service-icon bg-white rounded-full p-4">
                <ng-content select="[serviceIcon]"></ng-content>
            </div>
        <span class="service-title text-xl font-bold">{{ serviceName }}</span>
        </div>
        <p class="service-description">
          {{serviceDescription}}
        </p>
        <ul class="service-features list-disc list-inside text-left">
          @for(feature of serviceFeatures; track $index) {
            <li>{{feature}}</li>
          }
        </ul>
        <div class="service-divider w-full h-px bg-green-800 p-0.3"></div>
    </div>
</div>
